name: Daily AI & Databricks News

on:
  schedule:
    # 8:00 AM CST (14:00 UTC) and 2:00 PM CST (20:00 UTC)
    # Using :05 instead of :00 helps avoid top-of-the-hour GitHub queue delays
    - cron: '5 14 * * *'
    - cron: '5 20 * * *'
  workflow_dispatch:
    # Adds a manual "Run workflow" button in the GitHub Actions tab

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Fetch latest news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Change this one line to switch Gemini models.
          GEMINI_MODEL: gemini-3.5-flash-lite
        run: npm run fetch

      - name: Commit and push updated news.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if git diff --staged --quiet; then
            echo "No changes to news.json"
          else
            git commit -m "Update daily news ($(date -u +'%Y-%m-%d'))"
            git push
          fi
