name: Daily AI & Databricks News

on:
  schedule:
    # Runs daily around 12:15 UTC (6:15 AM CST / 7:15 AM CDT)
    - cron: '15 12 * * *'
  workflow_dispatch:
    # Adds a manual "Run workflow" button in the GitHub Actions tab

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Fetch latest news
        run: npm run fetch

      - name: Commit and push updated news.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if git diff --staged --quiet; then
            echo "No changes to news.json"
          else
            git commit -m "Update daily news ($(date -u +'%Y-%m-%d'))"
            git push
          fi
