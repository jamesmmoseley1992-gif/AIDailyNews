<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI &amp; Databricks Daily</title>
  <style>
    :root {
      --bg: #f0f4fa;
      --surface: #ffffff;
      --surface-alt: #f4f7fb;
      --text: #0f172a;
      --muted: #475569;
      --border: #d5dfec;
      --accent: #00448e;
      --accent-dark: #003166;
      --gold: #d5ad36;
      --gold-soft: #fdf8e6;
      --db-bg: #fff1f2;
      --db-text: #be123c;
      --ai-bg: #e6effa;
      --ai-text: #00448e;
      --llm-bg: #fdf8e6;
      --llm-text: #8a690a;
      --shadow: 0 2px 6px rgba(0, 68, 142, 0.06);
    }

    [data-theme="dark"] {
      --bg: #081221;
      --surface: #0e1c33;
      --surface-alt: #152744;
      --text: #f8fafc;
      --muted: #a5b4cb;
      --border: #1e3557;
      --accent: #4d94e6;
      --accent-dark: #3b82f6;
      --gold: #e8b00f;
      --gold-soft: #2b230a;
      --db-bg: #4c0519;
      --db-text: #fda4af;
      --ai-bg: #122c54;
      --ai-text: #93c5fd;
      --llm-bg: #332707;
      --llm-text: #fcd34d;
      --shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
    }

    .topbar {
      background: var(--surface);
      border-top: 4px solid var(--gold);
      border-bottom: 2px solid var(--accent);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .topbar-inner {
      width: 100%;
      padding: 0.9rem 2rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .brand h1 {
      margin: 0;
      font-size: 1.35rem;
      letter-spacing: -0.02em;
      color: var(--accent);
    }

    .updated {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .theme-btn {
      border: 1px solid var(--border);
      background: var(--surface-alt);
      color: var(--text);
      padding: 0.45rem 0.85rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.84rem;
      font-weight: 500;
    }

    .container {
      width: 100%;
      padding: 1.5rem 2rem 4rem;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 380px;
      gap: 1.75rem;
      align-items: start;
    }

    @media (max-width: 1024px) {
      .layout { grid-template-columns: 1fr; }
      .container, .topbar-inner { padding-left: 1rem; padding-right: 1rem; }
    }

    .toolbar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.85rem 1rem;
      margin-bottom: 1.25rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow);
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .tab {
      padding: 0.4rem 0.9rem;
      border: 1px solid var(--border);
      background: var(--surface-alt);
      color: var(--text);
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.83rem;
      font-weight: 600;
    }

    .tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .filters-right {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      flex: 1;
      justify-content: flex-end;
    }

    .select, .search {
      padding: 0.45rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface-alt);
      color: var(--text);
      font-size: 0.85rem;
    }

    .search { min-width: 220px; }

    .sub-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.4rem;
      margin: -0.65rem 0 1.25rem;
      padding: 0 0.25rem;
    }

    .sub-toolbar.hidden { display: none; }

    .sub-label {
      font-size: 0.76rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-right: 0.25rem;
    }

    .topic-pill {
      padding: 0.28rem 0.7rem;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.78rem;
      font-weight: 500;
    }

    .topic-pill:hover {
      border-color: var(--accent);
      color: var(--text);
    }

    .topic-pill.active {
      background: var(--ai-bg);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 700;
    }

    .topic-tag {
      font-size: 0.72rem;
      color: var(--muted);
      background: var(--surface-alt);
      border: 1px solid var(--border);
      padding: 0.1rem 0.45rem;
      border-radius: 6px;
      font-weight: 500;
    }

    .day-group { margin-bottom: 2rem; }

    .day-heading {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--accent);
      font-weight: 700;
      margin: 0 0 0.8rem;
      padding-bottom: 0.35rem;
      border-bottom: 2px solid var(--border);
    }

    .feed-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      grid-auto-flow: dense;
      gap: 1rem;
    }

    @media (max-width: 680px) {
      .feed-list { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.1rem 1.2rem;
      cursor: pointer;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 180px;
      transition: border-color 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
    }

    .card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 68, 142, 0.12);
    }

    .card.cat-Databricks { border-top: 3px solid #be123c; }
    .card.cat-AI { border-top: 3px solid var(--accent); }
    .card.cat-LLM { border-top: 3px solid var(--gold); }

    .card.bento-wide {
      grid-column: span 2;
      min-height: 195px;
      background: linear-gradient(135deg, #ffffff 0%, #e9f0fa 100%);
      border-top: 4px solid var(--gold);
    }

    [data-theme="dark"] .card.bento-wide {
      background: linear-gradient(135deg, var(--surface) 0%, var(--surface-alt) 100%);
    }

    @media (max-width: 680px) {
      .card.bento-wide { grid-column: span 1; }
    }

    .card-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      font-size: 0.76rem;
      color: var(--muted);
      margin-bottom: 0.55rem;
    }

    .card-meta-left {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.45rem;
    }

    .badge {
      font-weight: 700;
      padding: 0.14rem 0.55rem;
      border-radius: 999px;
      font-size: 0.7rem;
      letter-spacing: 0.02em;
    }

    .badge.Databricks { background: var(--db-bg); color: var(--db-text); }
    .badge.AI { background: var(--ai-bg); color: var(--ai-text); }
    .badge.LLM { background: var(--llm-bg); color: var(--llm-text); }

    .card h2 {
      margin: 0 0 0.45rem;
      font-size: 1.02rem;
      line-height: 1.35;
    }

    .card.bento-wide h2 { font-size: 1.2rem; }

    .card-summary {
      margin: 0;
      font-size: 0.86rem;
      color: var(--muted);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-cta {
      margin-top: 0.85rem;
      padding-top: 0.6rem;
      border-top: 1px solid var(--border);
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--accent);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sidebar {
      position: sticky;
      top: 5rem;
      display: grid;
      gap: 1rem;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: 3px solid var(--accent);
      border-radius: 12px;
      padding: 1.1rem;
      box-shadow: var(--shadow);
    }

    .panel h3 {
      margin: 0 0 0.2rem;
      font-size: 1.02rem;
    }

    .panel-sub {
      margin: 0 0 0.9rem;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .llm-list {
      display: grid;
      gap: 0.7rem;
    }

    .llm-card {
      display: block;
      width: 100%;
      text-align: left;
      cursor: pointer;
      color: var(--text);
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 0.85rem;
      transition: border-color 0.15s ease, transform 0.1s ease;
    }

    .llm-card:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .llm-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.25rem;
    }

    .llm-company {
      font-size: 0.74rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--llm-text);
      background: var(--llm-bg);
      padding: 0.1rem 0.45rem;
      border-radius: 4px;
    }

    .llm-version {
      font-size: 0.75rem;
      color: var(--muted);
      font-weight: 600;
    }

    .llm-name {
      font-weight: 700;
      font-size: 0.94rem;
      margin-bottom: 0.15rem;
    }

    .llm-date {
      font-size: 0.72rem;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 0.3rem;
    }

    .llm-desc {
      margin: 0;
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.45;
    }

    .meta-kv {
      display: grid;
      gap: 0.4rem;
      font-size: 0.8rem;
      margin-bottom: 0.85rem;
      padding: 0.65rem 0.75rem;
      background: var(--surface-alt);
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .meta-kv div { color: var(--muted); }
    .meta-kv strong { color: var(--text); }

    .source-list {
      display: grid;
      gap: 0.45rem;
    }

    .source-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8rem;
      padding: 0.4rem 0.55rem;
      border-radius: 6px;
      background: var(--surface-alt);
      border: 1px solid var(--border);
    }

    .source-origin {
      font-size: 0.72rem;
      color: var(--muted);
    }

    .source-badge {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.1rem 0.45rem;
      border-radius: 999px;
      background: var(--ai-bg);
      color: var(--ai-text);
      white-space: nowrap;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(3px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 100;
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      max-width: 700px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 1.6rem;
      position: relative;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }

    .modal-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface-alt);
      color: var(--text);
      font-size: 1.15rem;
      cursor: pointer;
    }

    .modal-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 0.65rem;
      padding-right: 2.5rem;
    }

    .modal h2 {
      margin: 0 0 1.15rem;
      font-size: 1.35rem;
      line-height: 1.3;
    }

    .modal-block {
      background: var(--surface-alt);
      border-left: 3px solid var(--accent);
      border-radius: 6px;
      padding: 0.85rem 1rem;
      margin-bottom: 0.9rem;
    }

    .modal-block.matters { border-left-color: #10b981; }
    .modal-block.affected { border-left-color: var(--gold); }

    .modal-block h4 {
      margin: 0 0 0.35rem;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }

    .modal-block p {
      margin: 0;
      font-size: 0.92rem;
      line-height: 1.55;
      white-space: pre-line;
    }

    .modal-actions {
      margin-top: 1.2rem;
      display: flex;
      gap: 0.65rem;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      border-radius: 8px;
      padding: 0.6rem 1.1rem;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    .btn-primary { background: var(--accent); color: #fff; }
    .btn-secondary { background: var(--surface-alt); color: var(--text); border: 1px solid var(--border); }

    .empty {
      padding: 2rem;
      text-align: center;
      color: var(--muted);
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 10px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <h1>AI &amp; Databricks Daily</h1>
        <div class="updated" id="last-updated">Loading latest briefing…</div>
      </div>
      <button class="theme-btn" id="theme-toggle" type="button">🌙 Dark Mode</button>
    </div>
  </header>

  <div class="container">
    <div class="layout">
      <section>
        <div class="toolbar">
          <div class="tabs" id="tabs">
            <button class="tab active" data-category="All">All</button>
            <button class="tab" data-category="Databricks">Databricks</button>
            <button class="tab" data-category="AI">AI News</button>
            <button class="tab" data-category="LLM">LLM Releases</button>
          </div>
          <div class="filters-right">
            <select id="source-filter" class="select" aria-label="Filter by source">
              <option value="All">All Sources</option>
            </select>
            <input
              type="search"
              id="search"
              class="search"
              placeholder="Search 7-day news..."
              aria-label="Search articles"
            />
          </div>
        </div>
        <div class="sub-toolbar" id="topic-bar">
          <span class="sub-label">AI Topics:</span>
          <button class="topic-pill active" data-topic="All">All Topics</button>
          <button class="topic-pill" data-topic="Models & Research">Models &amp; Research</button>
          <button class="topic-pill" data-topic="Agents & Coding">Agents &amp; Coding</button>
          <button class="topic-pill" data-topic="Enterprise & Strategy">Enterprise &amp; Strategy</button>
          <button class="topic-pill" data-topic="Infrastructure & MLOps">Infrastructure &amp; MLOps</button>
          <button class="topic-pill" data-topic="Policy & Safety">Policy &amp; Safety</button>
        </div>
        <main id="news-feed"></main>
      </section>

      <aside class="sidebar">
        <div class="panel">
          <h3>🚀 New LLM Models (7 Days)</h3>
          <p class="panel-sub">Click any model to view capabilities &amp; differences</p>
          <div class="llm-list" id="recent-models"></div>
        </div>

        <div class="panel">
          <h3>📡 Data Sources &amp; Refresh</h3>
          <p class="panel-sub">Automated cloud collection &amp; rolling 7-day window</p>
          <div class="meta-kv" id="refresh-meta"></div>
          <div class="source-list" id="source-pool"></div>
        </div>
      </aside>
    </div>
  </div>

  <!-- Story & Model Breakdown Modal -->
  <div class="modal-backdrop" id="modal-backdrop" role="dialog" aria-modal="true">
    <div class="modal">
      <button class="modal-close" id="modal-close" aria-label="Close">&times;</button>
      <div class="modal-meta" id="modal-meta"></div>
      <h2 id="modal-title"></h2>

      <div class="modal-block">
        <h4>Full Story</h4>
        <p id="modal-story"></p>
      </div>
      <div class="modal-block matters">
        <h4>Why It Matters</h4>
        <p id="modal-matters"></p>
      </div>
      <div class="modal-block affected">
        <h4>Who Is Affected</h4>
        <p id="modal-affected"></p>
      </div>

      <div class="modal-actions">
        <a class="btn btn-primary" id="modal-link" href="#" target="_blank" rel="noopener noreferrer">
          Read Original Article ↗
        </a>
        <button class="btn btn-secondary" id="modal-close-btn" type="button">Close</button>
      </div>
    </div>
  </div>

  <script>
    let allItems = [];
    let activeCategory = 'All';
    let activeTopic = 'All';
    let activeSource = 'All';
    let searchQuery = '';

    const feedEl = document.getElementById('news-feed');
    const updatedEl = document.getElementById('last-updated');
    const sourceEl = document.getElementById('source-filter');
    const searchEl = document.getElementById('search');
    const tabsEl = document.getElementById('tabs');
    const topicBarEl = document.getElementById('topic-bar');
    const modelsEl = document.getElementById('recent-models');
    const backdropEl = document.getElementById('modal-backdrop');
    const themeBtn = document.getElementById('theme-toggle');

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      themeBtn.textContent = theme === 'dark' ? '☀️ Light Mode' : '🌙 Dark Mode';
    }

    applyTheme(localStorage.getItem('theme') || 'light');
    themeBtn.addEventListener('click', () => {
      const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      localStorage.setItem('theme', next);
      applyTheme(next);
    });

    function formatRelative(iso) {
      const diffMs = Date.now() - Date.parse(iso);
      const mins = Math.floor(diffMs / 60000);
      if (mins < 60) return `${Math.max(1, mins)}m ago`;
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return `${hrs}h ago`;
      return `${Math.floor(hrs / 24)}d ago`;
    }

    function formatExact(iso) {
      return new Date(iso).toLocaleString(undefined, {
        month: 'short',
        day: 'numeric',
        year: 'numeric',
        hour: 'numeric',
        minute: '2-digit'
      });
    }

    function getDayLabel(iso) {
      const d = new Date(iso);
      const today = new Date();
      const yesterday = new Date();
      yesterday.setDate(today.getDate() - 1);

      if (d.toDateString() === today.toDateString()) return 'Today';
      if (d.toDateString() === yesterday.toDateString()) return 'Yesterday';
      return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
    }

    function openModal(item) {
      const metaEl = document.getElementById('modal-meta');
      metaEl.replaceChildren();

      const badge = document.createElement('span');
      badge.className = `badge ${item.category}`;
      badge.textContent = item.category;

      metaEl.append(badge);
      if (item.topic) {
        const topicTag = document.createElement('span');
        topicTag.className = 'topic-tag';
        topicTag.textContent = item.topic;
        metaEl.append(topicTag);
      }
      metaEl.append(`${item.source} • ${formatExact(item.publishedAt)}`);

      document.getElementById('modal-title').textContent = item.title;
      document.getElementById('modal-story').previousElementSibling.textContent = 'Full Story';
      document.getElementById('modal-story').textContent = item.fullStory || item.summary || '';
      document.getElementById('modal-matters').previousElementSibling.textContent = 'Why It Matters';
      document.getElementById('modal-matters').textContent = item.whyItMatters || '';
      document.getElementById('modal-affected').parentElement.style.display = 'block';
      document.getElementById('modal-affected').textContent = item.whoIsAffected || '';

      const linkEl = document.getElementById('modal-link');
      linkEl.style.display = 'inline-flex';
      linkEl.href = item.url;

      backdropEl.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function openModelModal(m) {
      const metaEl = document.getElementById('modal-meta');
      metaEl.replaceChildren();

      const badge = document.createElement('span');
      badge.className = 'badge LLM';
      badge.textContent = m.company || 'AI Lab';

      metaEl.append(badge, `Version: ${m.version || 'Latest'} • Released: ${m.releaseDate || 'Past 7 days'}`);

      document.getElementById('modal-title').textContent = m.name || 'Model';
      document.getElementById('modal-story').previousElementSibling.textContent = 'Model Description';
      document.getElementById('modal-story').textContent = m.fullDescription || m.description || '';
      document.getElementById('modal-matters').previousElementSibling.textContent = "How It's Different";
      document.getElementById('modal-matters').textContent = m.howItIsDifferent || '';
      document.getElementById('modal-affected').parentElement.style.display = 'none';
      document.getElementById('modal-link').style.display = 'none';

      backdropEl.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      backdropEl.classList.remove('open');
      document.body.style.overflow = '';
    }

    document.getElementById('modal-close').addEventListener('click', closeModal);
    document.getElementById('modal-close-btn').addEventListener('click', closeModal);
    backdropEl.addEventListener('click', (e) => {
      if (e.target === backdropEl) closeModal();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    function populateSources() {
      const sources = [...new Set(allItems.map((i) => i.source))].sort();
      sourceEl.replaceChildren(new Option('All Sources', 'All'));
      for (const s of sources) {
        sourceEl.appendChild(new Option(s, s));
      }
    }

    function renderFeed() {
      const q = searchQuery.trim().toLowerCase();
      const filtered = allItems
        .filter((item) => {
          const matchesCat = activeCategory === 'All' || item.category === activeCategory;
          const matchesTopic = activeTopic === 'All' || item.topic === activeTopic;
          const matchesSrc = activeSource === 'All' || item.source === activeSource;
          const matchesQuery =
            !q ||
            item.title.toLowerCase().includes(q) ||
            (item.summary || '').toLowerCase().includes(q) ||
            (item.source || '').toLowerCase().includes(q) ||
            (item.topic || '').toLowerCase().includes(q);
          return matchesCat && matchesTopic && matchesSrc && matchesQuery;
        })
        .sort((a, b) => Date.parse(b.publishedAt) - Date.parse(a.publishedAt));

      feedEl.replaceChildren();

      if (filtered.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = 'No matching articles in the past 7 days.';
        feedEl.appendChild(empty);
        return;
      }

      const groups = new Map();
      for (const item of filtered) {
        const label = getDayLabel(item.publishedAt);
        if (!groups.has(label)) groups.set(label, []);
        groups.get(label).push(item);
      }

      for (const [dayLabel, dayItems] of groups) {
        const section = document.createElement('div');
        section.className = 'day-group';

        const heading = document.createElement('h2');
        heading.className = 'day-heading';
        heading.textContent = `${dayLabel} (${dayItems.length})`;
        section.appendChild(heading);

        const list = document.createElement('div');
        list.className = 'feed-list';

        const topItem = [...dayItems].sort((a, b) => (b.importance || 5) - (a.importance || 5))[0];

        dayItems.forEach((item) => {
          const card = document.createElement('article');
          const isWide = item === topItem && (dayItems.length === 1 || dayItems.length % 2 === 1);
          card.className = `${isWide ? 'card bento-wide' : 'card'} cat-${item.category}`;
          card.tabIndex = 0;
          card.addEventListener('click', () => openModal(item));
          card.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              openModal(item);
            }
          });

          const top = document.createElement('div');
          const meta = document.createElement('div');
          meta.className = 'card-meta';

          const metaLeft = document.createElement('div');
          metaLeft.className = 'card-meta-left';

          const badge = document.createElement('span');
          badge.className = `badge ${item.category}`;
          badge.textContent = item.category;
          metaLeft.append(badge);

          if (item.topic) {
            const topicTag = document.createElement('span');
            topicTag.className = 'topic-tag';
            topicTag.textContent = item.topic;
            metaLeft.append(topicTag);
          }

          const source = document.createElement('span');
          source.textContent = item.source;
          metaLeft.append(source);

          const time = document.createElement('span');
          time.textContent = formatRelative(item.publishedAt);
          time.title = formatExact(item.publishedAt);

          meta.append(metaLeft, time);

          const title = document.createElement('h2');
          title.textContent = item.title;

          const summary = document.createElement('p');
          summary.className = 'card-summary';
          summary.textContent = item.summary || '';

          top.append(meta, title, summary);

          const cta = document.createElement('div');
          cta.className = 'card-cta';
          cta.innerHTML = '<span>Read summary &amp; impact</span><span>→</span>';

          card.append(top, cta);
          list.appendChild(card);
        });

        section.appendChild(list);
        feedEl.appendChild(section);
      }
    }

    function renderModels(tracker = {}) {
      const models = tracker.recentModels || [];
      modelsEl.replaceChildren();

      if (models.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = 'Run the workflow to populate recent LLM models.';
        modelsEl.appendChild(empty);
        return;
      }

      for (const m of models) {
        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'llm-card';
        card.addEventListener('click', () => openModelModal(m));

        const top = document.createElement('div');
        top.className = 'llm-top';

        const company = document.createElement('span');
        company.className = 'llm-company';
        company.textContent = m.company || 'AI Lab';

        const version = document.createElement('span');
        version.className = 'llm-version';
        version.textContent = m.version || '';

        top.append(company, version);

        const name = document.createElement('div');
        name.className = 'llm-name';
        name.textContent = m.name || 'Model';

        const dateEl = document.createElement('div');
        dateEl.className = 'llm-date';
        dateEl.textContent = `Released: ${m.releaseDate || 'Past 7 days'}`;

        const desc = document.createElement('p');
        desc.className = 'llm-desc';
        desc.textContent = m.description || '';

        card.append(top, name, dateEl, desc);
        modelsEl.appendChild(card);
      }
    }

    function renderSources(data) {
      const metaEl = document.getElementById('refresh-meta');
      const poolEl = document.getElementById('source-pool');
      const meta = data.meta || {};

      metaEl.replaceChildren();
      const rows = [
        ['Last Refreshed', data.lastUpdated ? `${formatExact(data.lastUpdated)} (${formatRelative(data.lastUpdated)})` : 'Pending'],
        ['Schedule', meta.schedule || 'Twice daily (8:00 AM & 2:00 PM CST)'],
        ['Coverage', `Past ${meta.windowDays || 7} days`],
        ['Analysis', meta.aiSummarizer || 'Gemini 2.5 Flash']
      ];
      for (const [k, v] of rows) {
        const div = document.createElement('div');
        const strong = document.createElement('strong');
        strong.textContent = `${k}: `;
        div.append(strong, v);
        metaEl.appendChild(div);
      }

      poolEl.replaceChildren();
      for (const s of meta.sources || []) {
        const row = document.createElement('div');
        row.className = 'source-row';

        const left = document.createElement('div');
        const name = document.createElement('div');
        name.style.fontWeight = '600';
        name.textContent = s.name;
        const origin = document.createElement('div');
        origin.className = 'source-origin';
        origin.textContent = `${s.origin} • ${s.type}`;
        left.append(name, origin);

        const badge = document.createElement('span');
        badge.className = 'source-badge';
        badge.textContent = `${s.count} items`;

        row.append(left, badge);
        poolEl.appendChild(row);
      }
    }

    tabsEl.addEventListener('click', (e) => {
      const btn = e.target.closest('.tab');
      if (!btn) return;
      activeCategory = btn.dataset.category;
      for (const tab of tabsEl.querySelectorAll('.tab')) {
        tab.classList.toggle('active', tab === btn);
      }
      const hideTopics = activeCategory === 'Databricks';
      topicBarEl.classList.toggle('hidden', hideTopics);
      if (hideTopics) {
        activeTopic = 'All';
        for (const pill of topicBarEl.querySelectorAll('.topic-pill')) {
          pill.classList.toggle('active', pill.dataset.topic === 'All');
        }
      }
      renderFeed();
    });

    topicBarEl.addEventListener('click', (e) => {
      const pill = e.target.closest('.topic-pill');
      if (!pill) return;
      activeTopic = pill.dataset.topic;
      for (const p of topicBarEl.querySelectorAll('.topic-pill')) {
        p.classList.toggle('active', p === pill);
      }
      renderFeed();
    });

    sourceEl.addEventListener('change', (e) => {
      activeSource = e.target.value;
      renderFeed();
    });

    searchEl.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderFeed();
    });

    async function init() {
      try {
        const res = await fetch('./data/news.json', { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const tracker = data.llmTracker || {};
        allItems = [...(data.items || []), ...(tracker.modelNews || [])];
        updatedEl.textContent = data.lastUpdated
          ? `Last updated: ${formatExact(data.lastUpdated)} (${allItems.length} articles)`
          : 'Waiting for first run';
        populateSources();
        renderFeed();
        renderModels(tracker);
        renderSources(data);
      } catch (err) {
        updatedEl.textContent = 'Could not load news.json';
        console.error(err);
      }
    }

    init();
  </script>
</body>
</html>
