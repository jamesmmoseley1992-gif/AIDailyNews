<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI &amp; Databricks Daily</title>
  <style>
    :root {
      --bg: #141414;
      --surface: #1f1f1f;
      --surface-hover: #2a2a2a;
      --text: #ffffff;
      --muted: #b3b3b3;
      --border: #333333;
      --red: #e50914;
      --red-hover: #f40612;
      --db: #ff4d4d;
      --ai: #3b82f6;
      --llm: #a855f7;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Helvetica Neue', Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      overflow-x: hidden;
    }

    /* Navbar */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.9) 0%, rgba(20, 20, 20, 0.85) 100%);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 0.85rem 4%;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 1.75rem;
    }

    .logo {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: var(--red);
      text-transform: uppercase;
      margin: 0;
    }

    .nav-links {
      display: flex;
      gap: 1.1rem;
      font-size: 0.88rem;
    }

    .nav-links a {
      color: var(--muted);
      text-decoration: none;
      transition: color 0.15s;
    }

    .nav-links a:hover { color: #fff; }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .updated {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .search {
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid #444;
      color: #fff;
      padding: 0.45rem 0.8rem;
      border-radius: 4px;
      font-size: 0.88rem;
      width: 220px;
    }

    .search:focus {
      outline: none;
      border-color: #fff;
    }

    /* Hero Banner */
    .hero {
      position: relative;
      padding: 4rem 4% 3rem;
      background:
        radial-gradient(circle at 80% 20%, rgba(229, 9, 20, 0.25), transparent 50%),
        radial-gradient(circle at 20% 80%, rgba(59, 130, 246, 0.18), transparent 50%),
        linear-gradient(180deg, #1b1b1b 0%, var(--bg) 100%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .hero-content {
      max-width: 760px;
    }

    .hero-tag {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--red);
      margin-bottom: 0.6rem;
    }

    .hero h2 {
      margin: 0 0 0.75rem;
      font-size: clamp(1.6rem, 3.2vw, 2.5rem);
      line-height: 1.18;
    }

    .hero-summary {
      color: #d4d4d4;
      font-size: 1rem;
      margin: 0 0 1.4rem;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .btn {
      border: none;
      border-radius: 4px;
      padding: 0.65rem 1.25rem;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: background 0.15s, transform 0.1s;
    }

    .btn:active { transform: scale(0.98); }

    .btn-primary {
      background: #ffffff;
      color: #000000;
    }

    .btn-primary:hover { background: #e5e5e5; }

    .btn-secondary {
      background: rgba(109, 109, 110, 0.7);
      color: #ffffff;
    }

    .btn-secondary:hover { background: rgba(109, 109, 110, 0.45); }

    .btn-red {
      background: var(--red);
      color: #ffffff;
    }

    .btn-red:hover { background: var(--red-hover); }

    /* Rows */
    main {
      padding: 1.5rem 0 4rem;
    }

    .row-section {
      margin-bottom: 2.25rem;
      position: relative;
    }

    .row-header {
      padding: 0 4%;
      margin-bottom: 0.75rem;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }

    .row-title {
      margin: 0;
      font-size: 1.2rem;
      font-weight: 700;
    }

    .row-count {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .carousel-wrap {
      position: relative;
    }

    .carousel {
      display: flex;
      gap: 0.85rem;
      overflow-x: auto;
      scroll-behavior: smooth;
      padding: 0.5rem 4% 1rem;
      scrollbar-width: none;
    }

    .carousel::-webkit-scrollbar { display: none; }

    .scroll-btn {
      position: absolute;
      top: 0.5rem;
      bottom: 1rem;
      width: 44px;
      background: rgba(20, 20, 20, 0.75);
      border: none;
      color: #fff;
      font-size: 1.6rem;
      cursor: pointer;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.2s, background 0.2s;
    }

    .carousel-wrap:hover .scroll-btn { opacity: 1; }
    .scroll-btn:hover { background: rgba(0, 0, 0, 0.9); }
    .scroll-btn.left { left: 0; }
    .scroll-btn.right { right: 0; }

    /* Cards */
    .card {
      flex: 0 0 290px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.05rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 185px;
      transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px) scale(1.02);
      background: var(--surface-hover);
      border-color: #666;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.6rem;
      font-size: 0.74rem;
      color: var(--muted);
    }

    .badge {
      padding: 0.15rem 0.5rem;
      border-radius: 3px;
      font-weight: 700;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .badge.Databricks { background: rgba(255, 77, 77, 0.18); color: #ff7b7b; }
    .badge.AI { background: rgba(59, 130, 246, 0.2); color: #93c5fd; }
    .badge.LLM { background: rgba(168, 85, 247, 0.2); color: #d8b4fe; }

    .card h3 {
      margin: 0 0 0.5rem;
      font-size: 0.98rem;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-snippet {
      margin: 0;
      font-size: 0.82rem;
      color: var(--muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-footer {
      margin-top: 0.8rem;
      font-size: 0.75rem;
      color: #888;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .more-hint {
      color: #fff;
      font-weight: 600;
      opacity: 0.85;
    }

    /* Model Cards */
    .model-card {
      flex: 0 0 260px;
      min-height: 145px;
      text-decoration: none;
      color: var(--text);
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      z-index: 100;
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      background: #181818;
      border: 1px solid #333;
      border-radius: 10px;
      max-width: 720px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 1.75rem;
      position: relative;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
    }

    .modal-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: #2b2b2b;
      color: #fff;
      font-size: 1.25rem;
      cursor: pointer;
    }

    .modal-close:hover { background: #444; }

    .modal-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      align-items: center;
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 0.75rem;
      padding-right: 2.5rem;
    }

    .modal h2 {
      margin: 0 0 1.25rem;
      font-size: 1.45rem;
      line-height: 1.3;
    }

    .modal-block {
      background: #222;
      border-left: 3px solid var(--red);
      border-radius: 6px;
      padding: 0.9rem 1rem;
      margin-bottom: 1rem;
    }

    .modal-block.matters { border-left-color: #3b82f6; }
    .modal-block.affected { border-left-color: #a855f7; }

    .modal-block h4 {
      margin: 0 0 0.35rem;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #d4d4d4;
    }

    .modal-block p {
      margin: 0;
      font-size: 0.94rem;
      color: #f1f5f9;
      line-height: 1.55;
      white-space: pre-line;
    }

    .modal-actions {
      margin-top: 1.35rem;
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .empty {
      padding: 1rem 4%;
      color: var(--muted);
      font-size: 0.9rem;
    }

    @media (max-width: 700px) {
      .nav-links { display: none; }
      .search { width: 100%; }
      .card { flex: 0 0 255px; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-left">
      <h1 class="logo">AI &amp; Databricks</h1>
      <div class="nav-links">
        <a href="#row-all">Latest</a>
        <a href="#row-databricks">Databricks</a>
        <a href="#row-ai">AI News</a>
        <a href="#row-llm">LLM Tracker</a>
      </div>
    </div>
    <div class="nav-right">
      <span class="updated" id="last-updated">Loading…</span>
      <input
        type="search"
        id="search"
        class="search"
        placeholder="Search titles &amp; topics..."
        aria-label="Search articles"
      />
    </div>
  </nav>

  <section class="hero" id="hero">
    <div class="hero-content">
      <div class="hero-tag" id="hero-tag">Top Story • Loading</div>
      <h2 id="hero-title">Loading latest AI &amp; Databricks briefing…</h2>
      <p class="hero-summary" id="hero-summary"></p>
      <div class="hero-actions" id="hero-actions"></div>
    </div>
  </section>

  <main id="rows-container"></main>

  <!-- Detail Modal -->
  <div class="modal-backdrop" id="modal-backdrop" role="dialog" aria-modal="true">
    <div class="modal">
      <button class="modal-close" id="modal-close" aria-label="Close">&times;</button>
      <div class="modal-meta" id="modal-meta"></div>
      <h2 id="modal-title"></h2>

      <div class="modal-block">
        <h4>Full Story</h4>
        <p id="modal-story"></p>
      </div>
      <div class="modal-block matters">
        <h4>Why It Matters</h4>
        <p id="modal-matters"></p>
      </div>
      <div class="modal-block affected">
        <h4>Who Is Affected</h4>
        <p id="modal-affected"></p>
      </div>

      <div class="modal-actions">
        <a class="btn btn-red" id="modal-link" href="#" target="_blank" rel="noopener noreferrer">
          Read Original Article ↗
        </a>
        <button class="btn btn-secondary" id="modal-close-btn" type="button">Close</button>
      </div>
    </div>
  </div>

  <script>
    let allItems = [];
    let trackerData = { trendingModels: [], modelNews: [] };
    let searchQuery = '';

    const updatedEl = document.getElementById('last-updated');
    const searchEl = document.getElementById('search');
    const rowsEl = document.getElementById('rows-container');
    const backdropEl = document.getElementById('modal-backdrop');

    function formatRelative(iso) {
      const diffMs = Date.now() - Date.parse(iso);
      const mins = Math.floor(diffMs / 60000);
      if (mins < 60) return `${Math.max(1, mins)}m ago`;
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return `${hrs}h ago`;
      return `${Math.floor(hrs / 24)}d ago`;
    }

    function formatExact(iso) {
      return new Date(iso).toLocaleString(undefined, {
        month: 'short',
        day: 'numeric',
        year: 'numeric',
        hour: 'numeric',
        minute: '2-digit'
      });
    }

    function formatCount(num) {
      if (num == null) return null;
      if (num >= 1000000) return `${(num / 1000000).toFixed(1)}M`;
      if (num >= 1000) return `${(num / 1000).toFixed(1)}k`;
      return String(num);
    }

    function openModal(item) {
      const metaEl = document.getElementById('modal-meta');
      metaEl.replaceChildren();

      const badge = document.createElement('span');
      badge.className = `badge ${item.category}`;
      badge.textContent = item.category;

      metaEl.append(
        badge,
        `${item.source} • ${formatExact(item.publishedAt)}`
      );

      document.getElementById('modal-title').textContent = item.title;
      document.getElementById('modal-story').textContent = item.fullStory || item.summary || '';
      document.getElementById('modal-matters').textContent =
        item.whyItMatters || 'Key update in the AI and data engineering ecosystem.';
      document.getElementById('modal-affected').textContent =
        item.whoIsAffected || 'Data Engineers, ML Engineers, and Technology Leaders.';
      document.getElementById('modal-link').href = item.url;

      backdropEl.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      backdropEl.classList.remove('open');
      document.body.style.overflow = '';
    }

    document.getElementById('modal-close').addEventListener('click', closeModal);
    document.getElementById('modal-close-btn').addEventListener('click', closeModal);
    backdropEl.addEventListener('click', (e) => {
      if (e.target === backdropEl) closeModal();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    function renderHero(topItem) {
      const tagEl = document.getElementById('hero-tag');
      const titleEl = document.getElementById('hero-title');
      const summaryEl = document.getElementById('hero-summary');
      const actionsEl = document.getElementById('hero-actions');

      if (!topItem) {
        tagEl.textContent = 'AI & Databricks Daily';
        titleEl.textContent = 'No articles loaded yet';
        summaryEl.textContent = 'Run the GitHub Action to fetch the latest 7 days of news.';
        actionsEl.replaceChildren();
        return;
      }

      tagEl.textContent = `Top Story • ${topItem.source} • ${formatRelative(topItem.publishedAt)}`;
      titleEl.textContent = topItem.title;
      summaryEl.textContent = topItem.summary || '';

      actionsEl.replaceChildren();

      const infoBtn = document.createElement('button');
      infoBtn.className = 'btn btn-primary';
      infoBtn.type = 'button';
      infoBtn.textContent = '▶ Story & Impact';
      infoBtn.addEventListener('click', () => openModal(topItem));

      const readLink = document.createElement('a');
      readLink.className = 'btn btn-secondary';
      readLink.href = topItem.url;
      readLink.target = '_blank';
      readLink.rel = 'noopener noreferrer';
      readLink.textContent = 'Read Source ↗';

      actionsEl.append(infoBtn, readLink);
    }

    function createNewsRow(id, title, items) {
      const section = document.createElement('section');
      section.className = 'row-section';
      section.id = id;

      const header = document.createElement('div');
      header.className = 'row-header';
      const h2 = document.createElement('h2');
      h2.className = 'row-title';
      h2.textContent = title;
      const count = document.createElement('span');
      count.className = 'row-count';
      count.textContent = `${items.length} stories`;
      header.append(h2, count);
      section.appendChild(header);

      if (items.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = 'No matching stories in this category.';
        section.appendChild(empty);
        return section;
      }

      const wrap = document.createElement('div');
      wrap.className = 'carousel-wrap';

      const carousel = document.createElement('div');
      carousel.className = 'carousel';

      for (const item of items) {
        const card = document.createElement('article');
        card.className = 'card';
        card.tabIndex = 0;
        card.addEventListener('click', () => openModal(item));
        card.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            openModal(item);
          }
        });

        const top = document.createElement('div');
        top.className = 'card-top';
        const badge = document.createElement('span');
        badge.className = `badge ${item.category}`;
        badge.textContent = item.category;
        const time = document.createElement('span');
        time.textContent = formatRelative(item.publishedAt);
        top.append(badge, time);

        const body = document.createElement('div');
        const h3 = document.createElement('h3');
        h3.textContent = item.title;
        const snippet = document.createElement('p');
        snippet.className = 'card-snippet';
        snippet.textContent = item.summary || '';
        body.append(h3, snippet);

        const footer = document.createElement('div');
        footer.className = 'card-footer';
        const src = document.createElement('span');
        src.textContent = item.source;
        const hint = document.createElement('span');
        hint.className = 'more-hint';
        hint.textContent = 'Details ▸';
        footer.append(src, hint);

        card.append(top, body, footer);
        carousel.appendChild(card);
      }

      const leftBtn = document.createElement('button');
      leftBtn.className = 'scroll-btn left';
      leftBtn.type = 'button';
      leftBtn.innerHTML = '&#8249;';
      leftBtn.addEventListener('click', () => carousel.scrollBy({ left: -620, behavior: 'smooth' }));

      const rightBtn = document.createElement('button');
      rightBtn.className = 'scroll-btn right';
      rightBtn.type = 'button';
      rightBtn.innerHTML = '&#8250;';
      rightBtn.addEventListener('click', () => carousel.scrollBy({ left: 620, behavior: 'smooth' }));

      wrap.append(leftBtn, carousel, rightBtn);
      section.appendChild(wrap);
      return section;
    }

    function createModelsRow(models) {
      const section = document.createElement('section');
      section.className = 'row-section';
      section.id = 'row-llm';

      const header = document.createElement('div');
      header.className = 'row-header';
      const h2 = document.createElement('h2');
      h2.className = 'row-title';
      h2.textContent = '🚀 New LLM Tracker (Hugging Face Trending)';
      const count = document.createElement('span');
      count.className = 'row-count';
      count.textContent = `${models.length} models`;
      header.append(h2, count);
      section.appendChild(header);

      const wrap = document.createElement('div');
      wrap.className = 'carousel-wrap';
      const carousel = document.createElement('div');
      carousel.className = 'carousel';

      for (const m of models) {
        const card = document.createElement('a');
        card.className = 'card model-card';
        card.href = m.url;
        card.target = '_blank';
        card.rel = 'noopener noreferrer';

        const top = document.createElement('div');
        top.className = 'card-top';
        const badge = document.createElement('span');
        badge.className = 'badge LLM';
        badge.textContent = m.tag || 'LLM';
        top.append(badge, 'Hugging Face');

        const h3 = document.createElement('h3');
        h3.textContent = m.id;

        const footer = document.createElement('div');
        footer.className = 'card-footer';
        const stats = [
          m.likes != null ? `❤️ ${formatCount(m.likes)}` : null,
          m.downloads != null ? `⬇️ ${formatCount(m.downloads)}` : null
        ]
          .filter(Boolean)
          .join('  •  ');
        footer.textContent = stats || 'Open on Hugging Face ↗';

        card.append(top, h3, footer);
        carousel.appendChild(card);
      }

      const leftBtn = document.createElement('button');
      leftBtn.className = 'scroll-btn left';
      leftBtn.type = 'button';
      leftBtn.innerHTML = '&#8249;';
      leftBtn.addEventListener('click', () => carousel.scrollBy({ left: -620, behavior: 'smooth' }));

      const rightBtn = document.createElement('button');
      rightBtn.className = 'scroll-btn right';
      rightBtn.type = 'button';
      rightBtn.innerHTML = '&#8250;';
      rightBtn.addEventListener('click', () => carousel.scrollBy({ left: 620, behavior: 'smooth' }));

      wrap.append(leftBtn, carousel, rightBtn);
      section.appendChild(wrap);
      return section;
    }

    function renderAll() {
      const q = searchQuery.trim().toLowerCase();
      const filterFn = (item) =>
        !q ||
        item.title.toLowerCase().includes(q) ||
        (item.summary || '').toLowerCase().includes(q) ||
        (item.source || '').toLowerCase().includes(q);

      const filtered = allItems
        .filter(filterFn)
        .sort((a, b) => Date.parse(b.publishedAt) - Date.parse(a.publishedAt));

      const dbItems = filtered.filter((i) => i.category === 'Databricks');
      const aiItems = filtered.filter((i) => i.category === 'AI');
      const modelNews = (trackerData.modelNews || []).filter(filterFn);
      const models = (trackerData.trendingModels || []).filter(
        (m) => !q || m.id.toLowerCase().includes(q)
      );

      renderHero(filtered[0]);

      rowsEl.replaceChildren(
        createNewsRow('row-all', '🔥 New This Week (7 Days)', filtered),
        createNewsRow('row-databricks', '🧱 Databricks Engineering & Releases', dbItems),
        createNewsRow('row-ai', '🤖 AI & Tech Headlines', aiItems),
        createNewsRow('row-model-news', '📣 New LLM & Model Releases', modelNews),
        createModelsRow(models)
      );
    }

    searchEl.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderAll();
    });

    async function init() {
      try {
        const res = await fetch('./data/news.json', { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        allItems = data.items || [];
        trackerData = data.llmTracker || { trendingModels: [], modelNews: [] };
        updatedEl.textContent = data.lastUpdated
          ? `Updated ${formatRelative(data.lastUpdated)}`
          : 'Waiting for first run';
        renderAll();
      } catch (err) {
        updatedEl.textContent = 'Could not load news.json';
        console.error(err);
      }
    }

    init();
  </script>
</body>
</html>
