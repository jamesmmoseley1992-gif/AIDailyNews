<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI &amp; Databricks Daily</title>
<style>
  :root {
    --bg: #f5f7fb; --surface: #ffffff; --ink: #0f172a; --muted: #5b6b82; --line: #e3e9f2;
    --blue: #00448e; --blue-soft: #e8f0fb; --gold: #d5ad36; --gold-soft: #fbf5e0;
    --db: #d6301b; --accent: var(--blue);
    --shadow: 0 1px 2px rgba(15,23,42,.05), 0 8px 24px rgba(15,23,42,.05);
    --pad: clamp(16px, 2.4vw, 56px);
  }
  :root { --body: #334155; --gold-ink: #8a690a; --db-soft: #fde7e3; --hover: #ffffff; }
  [data-theme="dark"] {
    --bg: #081221; --surface: #0e1c33; --ink: #f1f5f9; --muted: #9fb0c9; --line: #1e3557;
    --blue: #6aa9f0; --blue-soft: #14305c; --gold-soft: #2b230a; --db: #ff6b57; --db-soft: #4a1a15;
    --body: #c5d1e3; --gold-ink: #f0c75a; --hover: #152744;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.25);
  }
  body.db { --accent: var(--db); }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; }

  /* ---------- header + tabs ---------- */
  .top { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
  .top-in { padding: 14px var(--pad) 0; }
  .brand-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); }
  h1 { margin: 0; font-size: clamp(24px, 1.8vw, 34px); letter-spacing: -.02em; color: var(--blue); line-height: 1.15; }
.head-right { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: flex-end; }
  .theme-btn { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 7px 12px; font: 600 13px/1 inherit; cursor: pointer; }
  .stamp { color: var(--muted); font-size: 13px; text-align: right; padding-bottom: 4px; }
  .tabs { display: flex; gap: 4px; margin-top: 10px; overflow-x: auto; }
  .tab { appearance: none; border: 0; background: none; cursor: pointer; padding: 11px 18px 12px; font: 600 14.5px/1 inherit; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; border-radius: 8px 8px 0 0; }
  .tab:hover { color: var(--ink); background: var(--bg); }
  .tab.on { color: var(--blue); border-bottom-color: var(--gold); }
  .tab.on.db { color: var(--db); }
  .tab .n { margin-left: 7px; font-size: 11.5px; font-weight: 700; background: var(--bg); color: var(--muted); padding: 2px 7px; border-radius: 999px; }
  .tab.on .n { background: var(--blue-soft); color: var(--blue); }
  .tab.on.db .n { background: var(--db-soft); color: var(--db); }

  main { padding: 22px var(--pad) 56px; }
  h2.sec { margin: 0 0 12px; font-size: 19px; letter-spacing: -.01em; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  h2.sec span, h2.sec a { font-size: 13px; font-weight: 500; color: var(--muted); }
  h2.sec a { color: var(--blue); font-weight: 600; cursor: pointer; text-decoration: none; }
  .block { margin-bottom: 28px; }

  /* ---------- overview ---------- */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: clamp(12px, 1.2vw, 24px); margin-bottom: 18px; }
  .stat { background: var(--surface); border-radius: 14px; padding: 12px 18px; box-shadow: var(--shadow); cursor: pointer; border: 0; text-align: left; font: inherit; color: inherit; }
  .stat:hover { outline: 2px solid var(--blue-soft); }
  .stat b { display: block; font-size: 28px; line-height: 1.05; letter-spacing: -.02em; color: var(--blue); }
  .stat span { font-size: 12.5px; color: var(--muted); }
  .stat small { display: block; margin-top: 6px; font-size: 12px; color: var(--ink); font-weight: 600; }
  .hero { align-items: start; display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(0, 1fr); gap: clamp(14px, 1.3vw, 26px); margin-bottom: 28px; }
  .lead { background: linear-gradient(160deg, #00366f 0%, #00448e 60%, #1560b3 100%); color: #fff; border-radius: 18px; padding: 28px 32px; box-shadow: var(--shadow); display: flex; flex-direction: column; }
  .lead .tag { align-self: flex-start; background: rgba(255,255,255,.16); border-radius: 999px; padding: 3px 11px; font-size: 12px; font-weight: 700; letter-spacing: .04em; }
  .lead h2 { margin: 14px 0 12px; max-width: 36ch; font-size: clamp(22px, 1.7vw, 34px); line-height: 1.2; letter-spacing: -.015em; }
  .lead p { margin: 0 0 14px; max-width: 72ch; color: #dbe7f7; font-size: clamp(15px, 1vw, 18px); }
  .lead .why { margin-top: auto; border-top: 1px solid rgba(255,255,255,.2); padding-top: 14px; font-size: 14px; }
  .lead .why b { color: var(--gold); font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; display: block; margin-bottom: 2px; }
  .lead a { color: #fff; font-weight: 600; font-size: 13.5px; }
  .top5 { background: var(--surface); border-radius: 18px; padding: 20px 22px; box-shadow: var(--shadow); }
  h3.mini { margin: 0 0 12px; font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .top5 ol { list-style: none; margin: 0; padding: 0; counter-reset: n; }
  .top5 li { counter-increment: n; display: grid; grid-template-columns: 28px 1fr; gap: 6px; padding: 10px 0; border-top: 1px solid var(--line); }
  .top5 li:first-child { border-top: 0; padding-top: 0; }
  .top5 li::before { content: counter(n); font-weight: 800; font-size: 20px; color: var(--gold); line-height: 1.1; }
  .top5 a { color: var(--ink); text-decoration: none; font-weight: 600; font-size: 14.5px; line-height: 1.35; }
  .top5 a:hover { color: var(--blue); }
  .also > summary { list-style: none; cursor: pointer; }
  .also > summary::-webkit-details-marker { display: none; }
  .also .t { font-weight: 600; font-size: 14.5px; line-height: 1.35; display: block; }
  .also > summary:hover .t { color: var(--blue); }
  .also[open] > summary .t { color: var(--blue); }
  .also > summary::after { content: 'Show summary'; display: inline-block; margin-top: 3px; font-size: 12px; font-weight: 600; color: var(--blue); }
  .also[open] > summary::after { content: 'Hide summary'; }
  .also-body { margin-top: 10px; padding: 12px 14px; background: var(--bg); border-radius: 10px; }
  .also-body p { margin: 0 0 8px; font-size: 13.5px; line-height: 1.55; color: var(--body); }
  .also-body p.none { color: var(--muted); font-style: italic; }
  .also-body .story-why { margin: 8px 0 10px; }
  .top5 small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }

  .models-strip, .models-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
  .model { background: var(--surface); border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow); border-top: 4px solid var(--c); }
  .model .co { display: inline-block; background: var(--c); color: var(--f); font-size: 11px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; border-radius: 4px; padding: 1px 7px; }
  .model b { display: block; margin: 8px 0 2px; font-size: 15px; }
  .model small { color: var(--muted); font-size: 12px; }
  .models-grid { grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: clamp(14px, 1.2vw, 22px); align-items: start; }
  .models-grid .model { padding: 18px 20px; }
  .models-grid .model p { margin: 8px 0 0; font-size: 14px; color: var(--body); }
  .models-grid .model .diff { margin-top: 10px; background: var(--gold-soft); border-radius: 8px; padding: 8px 10px; font-size: 13px; }
  .models-grid .model .diff b { display: block; margin: 0; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--gold-ink); }

  .snap { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(14px, 1.3vw, 26px); }
  .snap-card { background: var(--surface); border-radius: 16px; padding: 18px 20px; box-shadow: var(--shadow); }
  .snap-card.db { border-top: 4px solid var(--db); }
  .snap-card.ai { border-top: 4px solid var(--blue); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
  .tile { appearance: none; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 12px; text-align: left; cursor: pointer; font: inherit; color: inherit; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .tile:hover { border-color: var(--blue); background: var(--hover); }
  .tile span { font-size: 13.5px; font-weight: 600; line-height: 1.25; }
  .tile b { font-size: 18px; color: var(--blue); }
  .snap-card.db .tile b { color: var(--db); }
  .tile.zero { opacity: .5; }

  /* ---------- news tabs ---------- */
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-bottom: 18px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; }
  .chip { appearance: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 13px; font: 600 13px/1.2 inherit; color: var(--muted); cursor: pointer; }
  .chip:hover { border-color: var(--accent); color: var(--ink); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip .n { opacity: .7; font-weight: 500; margin-left: 4px; }
  .search { min-width: 260px; padding: 8px 13px; border: 1px solid var(--line); border-radius: 10px; font: inherit; background: var(--surface); color: var(--ink); }
  .topics { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); gap: clamp(14px, 1.2vw, 24px); align-items: start; }
  .panel { background: var(--surface); border-radius: 16px; padding: 18px 20px 12px; box-shadow: var(--shadow); }
  .panel h4 { margin: 0 0 8px; display: flex; align-items: center; gap: 8px; font-size: 15px; }
  .panel h4 i { width: 9px; height: 9px; border-radius: 50%; background: var(--dot, var(--blue)); }
  .panel h4 em { margin-left: auto; font-style: normal; font-size: 12px; color: var(--muted); font-weight: 600; }
  .panel .all { display: block; padding: 8px 0 6px; border: 0; border-top: 1px solid var(--line); color: var(--accent); font: 600 13px/1.4 inherit; cursor: pointer; background: none; width: 100%; text-align: left; }
  details.row { border-top: 1px solid var(--line); }
  details.row > summary { list-style: none; cursor: pointer; padding: 9px 0; display: grid; grid-template-columns: 1fr auto; gap: 10px; font-size: 14px; line-height: 1.4; }
  details.row > summary::-webkit-details-marker { display: none; }
  details.row > summary:hover b { color: var(--accent); }
  details.row b { font-weight: 600; }
  details.row time { color: var(--muted); font-size: 12px; white-space: nowrap; }
  details.row .src { color: var(--muted); font-size: 12px; display: block; font-weight: 400; }
  .detail { padding: 0 0 12px; font-size: 13.5px; color: var(--body); }
  .detail p { margin: 0 0 8px; }
  .detail .why { background: var(--gold-soft); border-radius: 8px; padding: 8px 10px; }
  .detail .why b { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--gold-ink); display: block; }
  .detail a { font-weight: 600; color: var(--accent); font-size: 13px; }
  .flag { font-size: 11px; color: var(--muted); border: 1px dashed var(--line); border-radius: 5px; padding: 0 5px; margin-left: 4px; }

  .daygroup { margin-bottom: 14px; }
  .daygroup > summary { cursor: pointer; list-style: none; background: var(--surface); border-radius: 10px; padding: 10px 16px; font-weight: 800; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); box-shadow: var(--shadow); display: flex; gap: 8px; align-items: center; }
  .daygroup > summary::-webkit-details-marker { display: none; }
  .daygroup > summary::before { content: '\25BE'; font-size: 11px; transition: transform .12s; }
  .daygroup:not([open]) > summary::before { transform: rotate(-90deg); }
  .daygroup > summary span { margin-left: auto; color: var(--muted); font-weight: 600; letter-spacing: 0; text-transform: none; }
  .daygroup > summary { margin-bottom: 12px; }
  .stories { columns: 480px; column-gap: clamp(14px, 1.2vw, 22px); margin-bottom: 22px; }
  .story { break-inside: avoid; margin: 0 0 clamp(14px, 1.2vw, 22px); background: var(--surface); border-radius: 16px; padding: 20px 22px 18px; box-shadow: var(--shadow); border-left: 4px solid var(--accent); }
  .story-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .story-meta .tag { background: var(--blue-soft); color: var(--accent); font-weight: 700; border-radius: 999px; padding: 2px 10px; }
  body.db .story-meta .tag { background: var(--db-soft); }
  .story h3 { margin: 0 0 10px; font-size: 18px; line-height: 1.3; letter-spacing: -.01em; }
  .story h3 a { color: var(--ink); text-decoration: none; }
  .story h3 a:hover { color: var(--accent); text-decoration: underline; }
  .story-sum p { margin: 0 0 10px; font-size: 14.5px; line-height: 1.6; color: var(--body); }
  .story-sum .none { color: var(--muted); font-style: italic; }
  .story-why { background: var(--gold-soft); border-radius: 10px; padding: 10px 13px; margin: 4px 0 12px; font-size: 13.5px; color: var(--body); }
  .story-why b { display: block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--gold-ink); margin-bottom: 2px; }
  .story-link { font-size: 13px; font-weight: 600; color: var(--accent); text-decoration: none; }
  .story-link:hover { text-decoration: underline; }
  .empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; padding: 28px; text-align: center; color: var(--muted); }

  /* ---------- sources ---------- */
  .srcgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); gap: 14px; }
  .srcrow { background: var(--surface); border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow); display: flex; justify-content: space-between; gap: 10px; align-items: center; }
  .srcrow small { display: block; color: var(--muted); font-size: 12px; }
  .srcrow .cnt { background: var(--blue-soft); color: var(--blue); font-weight: 700; font-size: 12px; border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
  .kv { background: var(--surface); border-radius: 12px; padding: 16px 18px; box-shadow: var(--shadow); margin-bottom: 18px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  .kv div small { display: block; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
  .kv div b { font-size: 15px; }

  @media (max-width: 980px) { .stats { grid-template-columns: repeat(2, 1fr); } .hero, .snap { grid-template-columns: 1fr; } .search { min-width: 0; width: 100%; } }
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand-row">
    <div><div class="eyebrow">Daily briefing</div><h1>AI &amp; Databricks Daily</h1></div>
    <div class="head-right"><div class="stamp" id="stamp">Loading latest briefing&hellip;</div><button class="theme-btn" id="theme-toggle" type="button">Dark mode</button></div>
  </div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Sections"></nav>
</div></header>
<main id="view"></main>

<script>
(function () {
  const btn = document.getElementById('theme-toggle');
  const apply = (t) => { document.documentElement.setAttribute('data-theme', t); btn.textContent = t === 'dark' ? 'Light mode' : 'Dark mode'; };
  let saved = 'light';
  try { saved = localStorage.getItem('theme') || 'light'; } catch (e) {}
  apply(saved);
  btn.addEventListener('click', () => {
    const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem('theme', next); } catch (e) {}
    apply(next);
  });
})();
</script>
<script>
(async () => {
let DATA;
try {
  const res = await fetch('./data/news.json', { cache: 'no-store' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  DATA = await res.json();
} catch (err) {
  document.getElementById('view').innerHTML = '<div class="empty">Could not load news.json</div>';
  document.getElementById('stamp').textContent = 'Could not load the latest briefing';
  console.error(err);
  return;
}

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const LEGACY = {
  'Models & Research': 'Models, Research & Advancement',
  'Agents & Coding': 'Agents & Developer Tools',
  'Enterprise & Strategy': 'Business & Adoption',
  'Infrastructure & MLOps': 'Infrastructure & Compute',
  'Policy & Safety': 'AI Governance & Regulation'
};

const AI_TOPICS = [
  'Business & Adoption', 'AI Governance & Regulation', 'Models, Research & Advancement',
  'Agents & Developer Tools', 'Infrastructure & Compute', 'Environment & Sustainability', 'Funding & Markets'
];
const DB_TOPICS = [
  'Genie & AI/BI', 'Unity Catalog & Governance', 'Agent Bricks & Mosaic AI',
  'Data Engineering & Lakeflow', 'SQL & Warehousing', 'Apps & Lakebase', 'Platform & Administration'
];

const ALL = [...DATA.items, ...((DATA.llmTracker && DATA.llmTracker.modelNews) || [])]
  .map((i) => ({ ...i, topic: LEGACY[i.topic] || i.topic }))
  .sort((a, b) => Date.parse(b.publishedAt) - Date.parse(a.publishedAt));

const MODELS = (DATA.llmTracker && DATA.llmTracker.recentModels) || [];
const NOW = new Date();
const TODAY = NOW.toDateString();

const isToday = (i) => new Date(i.publishedAt).toDateString() === TODAY;
const timeOf = (iso) => new Date(iso).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
const dateOf = (iso) => new Date(iso).toLocaleDateString([], { month: 'short', day: 'numeric' });
const longDate = (d) => d.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });

function dayLabel(iso) {
  const d = new Date(iso).toDateString();
  const y = new Date(NOW); y.setDate(y.getDate() - 1);
  if (d === TODAY) return 'Today';
  if (d === y.toDateString()) return 'Yesterday';
  return new Date(iso).toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' });
}

// Google News headlines end with " - Publisher"; split that off for cleaner display.
function parts(i) {
  const m = /^(.*\S)\s+[-–—]\s+([^-–—]{2,40})$/.exec(i.title);
  if (m && /google|llm releases/i.test(i.source)) return { title: m[1], publisher: m[2] };
  return { title: i.title, publisher: i.source };
}
const headline = (i) => parts(i).title;
const publisher = (i) => parts(i).publisher;
const body = (i) => (i.aiAnalyzed && i.fullStory ? i.fullStory : '');
const lede = (i) => {
  const t = body(i);
  return t ? t.split(/\n\n/)[0] : '';
};

const BRANDS = [
  ['openai', '#10a37f'], ['anthropic', '#d97757'], ['google', '#4285f4'], ['meta', '#0866ff'],
  ['mistral', '#fa520f'], ['qwen', '#615cef'], ['deepseek', '#4d6bfe'], ['baidu', '#2932e1'],
  ['x-ai', '#111111'], ['microsoft', '#0078d4'], ['nvidia', '#76b900'], ['amazon', '#ff9900'],
  ['inclusion', '#1677ff'], ['thinking', '#8b5cf6'], ['nex', '#0ea5a4']
];
function brand(company) {
  const key = String(company || '').toLowerCase();
  let bg = (BRANDS.find(([k]) => key.includes(k)) || [])[1];
  if (!bg) {
    let h = 0;
    for (const ch of key) h = (h * 31 + ch.charCodeAt(0)) % 360;
    return { bg: `hsl(${h},60%,40%)`, fg: '#fff' };
  }
  const n = parseInt(bg.slice(1), 16);
  const lin = (v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; };
  const L = 0.2126 * lin(n >> 16) + 0.7152 * lin((n >> 8) & 255) + 0.0722 * lin(n & 255);
  return { bg, fg: L > 0.4 ? '#111827' : '#fff' };
}
const companyOf = (m) => String(m.company || 'AI Lab');
const nameOf = (m) => {
  const n = String(m.name || '').replace(/^[^:]+:\s*/, '');
  const v = String(m.version || '');
  const generic = /^(release|latest|open weights|text-generation|image-text-to-text)?$/i.test(v);
  return generic || n.toLowerCase().includes(v.toLowerCase()) ? n : `${n} ${v}`;
};

const ai = ALL.filter((i) => i.category === 'AI' || i.category === 'LLM');
const db = ALL.filter((i) => i.category === 'Databricks');
const todays = ALL.filter(isToday);
const rank = (a, b) => (b.aiAnalyzed ? 1 : 0) - (a.aiAnalyzed ? 1 : 0) || (b.importance || 5) - (a.importance || 5) || Date.parse(b.publishedAt) - Date.parse(a.publishedAt);
const leadPool = (todays.length ? todays : ALL).filter((i) => i.category !== 'Databricks' || true).slice().sort(rank);
const lead = leadPool[0];
const countBy = (arr, key) => arr.reduce((m, i) => (m[i[key]] = (m[i[key]] || 0) + 1, m), {});


const TABS = [
  ['overview', 'Overview'], ['ai', 'AI News'], ['db', 'Databricks'], ['models', 'LLM Models'], ['sources', 'Sources']
];
const state = { tab: 'overview', ai: 'All', db: 'All', q: '' };
const DOTS_AI = ['#00448e', '#7c3aed', '#0ea5a4', '#d97706', '#475569', '#16a34a', '#be185d'];
const DOTS_DB = ['#ff6a55', '#3b82f6', '#8b5cf6', '#0d9488', '#d97706', '#db2777', '#64748b'];
const $ = (id) => document.getElementById(id);

$('stamp').innerHTML = `${esc(DATA.lastUpdated ? 'Updated ' + new Date(DATA.lastUpdated).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : longDate(NOW))}<br>${ALL.length} stories &middot; 7-day window`;

const counts = { ai: ai.length, db: db.length, models: MODELS.length };
function renderTabs() {
  $('tabs').innerHTML = TABS.map(([k, label]) => `<button class="tab ${state.tab === k ? 'on' : ''} ${k === 'db' ? 'db' : ''}" role="tab" aria-selected="${state.tab === k}" data-tab="${k}">${label}${counts[k] != null ? `<span class="n">${counts[k]}</span>` : ''}</button>`).join('');
  document.body.classList.toggle('db', state.tab === 'db');
}

const matches = (i) => !state.q || [i.title, i.summary, i.source, i.topic].some((t) => String(t || '').toLowerCase().includes(state.q.toLowerCase()));

const storyCard = (i) => {
  const paras = body(i) ? body(i).split(/\n\n/).filter(Boolean) : [];
  return `<article class="story">
    <div class="story-meta"><span class="tag">${esc(i.topic || i.category)}</span><span>${esc(publisher(i))}</span><span>${esc(dateOf(i.publishedAt))}, ${esc(timeOf(i.publishedAt))}</span>${i.aiAnalyzed ? '' : '<span class="flag">headline only</span>'}</div>
    <h3><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(headline(i))}</a></h3>
    <div class="story-sum">${paras.length ? paras.map((t) => `<p>${esc(t)}</p>`).join('') : '<p class="none">A full summary is not available for this story yet. Open the original for the details.</p>'}</div>
    ${i.whyItMatters && i.aiAnalyzed ? `<div class="story-why"><b>Why it matters</b>${esc(i.whyItMatters)}</div>` : ''}
    <a class="story-link" href="${esc(i.url)}" target="_blank" rel="noopener">Read original &#8599;</a>
  </article>`;
};

const row = (i) => `
  <details class="row">
    <summary><span><b>${esc(headline(i))}</b>${i.aiAnalyzed ? '' : '<span class="flag">headline only</span>'}<span class="src">${esc(publisher(i))}</span></span><time>${esc(dateOf(i.publishedAt))}</time></summary>
    <div class="detail">
      ${lede(i) ? `<p>${esc(lede(i))}</p>` : '<p style="color:var(--muted)">Full article summary unavailable. Open the original for details.</p>'}
      ${i.whyItMatters ? `<div class="why"><b>Why it matters</b>${esc(i.whyItMatters)}</div>` : ''}
      <p style="margin-top:8px"><a href="${esc(i.url)}" target="_blank" rel="noopener">Read original &#8599;</a></p>
    </div>
  </details>`;

function modelCard(m, full) {
  const b = brand(companyOf(m));
  return `<div class="model" style="--c:${b.bg};--f:${b.fg}"><span class="co">${esc(companyOf(m))}</span><b>${esc(nameOf(m))}</b><small>Released ${esc(m.releaseDate)}</small>
    ${full ? `${m.fullDescription || m.description ? `<p>${esc(m.fullDescription || m.description)}</p>` : ''}${m.howItIsDifferent ? `<div class="diff"><b>${m.previousModel ? 'Versus previous version: ' + esc(nameOf(m.previousModel)) : 'How it is different'}</b>${esc(m.howItIsDifferent)}</div>` : ''}` : ''}</div>`;
}

/* ---------- Overview ---------- */
function alsoItem(i) {
  const paras = body(i) ? body(i).split(/\n\n/).filter(Boolean) : [];
  return `<details class="also">
    <summary><span class="t">${esc(headline(i))}</span><small>${esc(i.topic || i.category)} &middot; ${esc(publisher(i))}${i.aiAnalyzed ? '' : ' &middot; headline only'}</small></summary>
    <div class="also-body">
      ${paras.length ? paras.map((t) => `<p>${esc(t)}</p>`).join('') : '<p class="none">A full summary is not available for this story yet. Open the original for the details.</p>'}
      ${i.whyItMatters && i.aiAnalyzed ? `<div class="story-why"><b>Why it matters</b>${esc(i.whyItMatters)}</div>` : ''}
      <a class="story-link" href="${esc(i.url)}" target="_blank" rel="noopener">Read original &#8599;</a>
    </div></details>`;
}

function overview() {
  if (!ALL.length) return '<div class="empty">No stories yet. Run the workflow to populate the briefing.</div>';
  const topTopic = Object.entries(countBy(ai.filter((i) => i.topic), 'topic')).sort((a, b) => b[1] - a[1])[0];
  const stats = [
    ['ai', todays.length, 'Stories today', `${todays.filter((i) => i.aiAnalyzed).length} fully summarized`],
    ['db', db.length, 'Databricks updates', 'this week'],
    ['models', MODELS.length, 'New LLM models', MODELS.slice(0, 2).map(nameOf).join(', ')],
    ['ai', topTopic ? topTopic[1] : 0, 'Top AI topic', topTopic ? topTopic[0] : '']
  ].map(([t, n, l, s]) => `<button class="stat" data-go="${t}"><b>${esc(n)}</b><span>${esc(l)}</span><small>${esc(s)}</small></button>`).join('');

  const also = leadPool.filter((i) => i !== lead).slice(0, 5);
  const aiC = countBy(ai, 'topic'), dbC = countBy(db, 'topic');
  const tiles = (topics, kind, c) => topics.map((t) => `<button class="tile ${c[t] ? '' : 'zero'}" data-go="${kind}" data-topic="${esc(t)}"><span>${esc(t)}</span><b>${c[t] || 0}</b></button>`).join('');

  return `
  <div class="stats">${stats}</div>
  <section class="hero">
    <article class="lead">
      <span class="tag">LEAD STORY &middot; ${esc(lead.topic || lead.category)}</span>
      <h2>${esc(headline(lead))}</h2>
      <p>${esc(lede(lead) || 'Headline-level item: the full article text was not available to summarize.')}</p>
      <div class="why"><b>Why it matters</b>${esc(lead.whyItMatters || '')}</div>
      <p style="margin:12px 0 0"><a href="${esc(lead.url)}" target="_blank" rel="noopener">${esc(publisher(lead))} &#8599;</a></p>
    </article>
    <aside class="top5"><h3 class="mini">Also making news today</h3>
      <ol>${also.map((i) => `<li>${alsoItem(i)}</li>`).join('')}</ol>
    </aside>
  </section>
  <section class="block"><h2 class="sec">New LLM models<a data-go="models">View all ${MODELS.length} &rarr;</a></h2>
    <div class="models-strip">${MODELS.slice(0, 6).map((m) => modelCard(m, false)).join('')}</div></section>
  <section class="snap block">
    <div class="snap-card ai"><h2 class="sec">AI news by topic<span>jump to a topic</span></h2><div class="tiles">${tiles(AI_TOPICS, 'ai', aiC)}</div></div>
    <div class="snap-card db"><h2 class="sec">Databricks by topic<span>jump to a topic</span></h2><div class="tiles">${tiles(DB_TOPICS, 'db', dbC)}</div></div>
  </section>`;
}

/* ---------- AI / Databricks tabs ---------- */
function newsShell(kind) {
  const list = kind === 'ai' ? ai : db, topics = kind === 'ai' ? AI_TOPICS : DB_TOPICS;
  const c = countBy(list, 'topic');
  const chips = `<button class="chip ${state[kind] === 'All' ? 'on' : ''}" data-topic="All">All topics<span class="n">${list.length}</span></button>` +
    topics.filter((t) => c[t]).map((t) => `<button class="chip ${state[kind] === t ? 'on' : ''}" data-topic="${esc(t)}">${esc(t)}<span class="n">${c[t]}</span></button>`).join('');
  return `<div class="toolbar"><div class="chips" id="chips">${chips}</div>
    <input class="search" id="q" type="search" placeholder="Search ${kind === 'ai' ? 'AI news' : 'Databricks'}..." value="${esc(state.q)}" aria-label="Search" /></div>
    <div id="results"></div>`;
}

function newsResults(kind) {
  const list = (kind === 'ai' ? ai : db).filter(matches), topics = kind === 'ai' ? AI_TOPICS : DB_TOPICS;
  const dots = kind === 'ai' ? DOTS_AI : DOTS_DB, sel = state[kind];
  if (!list.length) return '<div class="empty">No stories match.</div>';

  if (sel === 'All') {
    return `<div class="topics">${topics.map((t, idx) => {
      const items = list.filter((i) => i.topic === t);
      if (!items.length) return '';
      return `<div class="panel" style="--dot:${dots[idx % dots.length]}"><h4><i></i>${esc(t)}<em>${items.length}</em></h4>
        ${items.slice(0, 3).map(row).join('')}
        ${items.length > 3 ? `<button class="all" data-topic="${esc(t)}">See all ${items.length} in ${esc(t)} &rarr;</button>` : ''}</div>`;
    }).join('')}</div>`;
  }
  const items = list.filter((i) => i.topic === sel);
  if (!items.length) return '<div class="empty">No stories match.</div>';
  const groups = new Map();
  for (const i of items) { const k = dayLabel(i.publishedAt); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(i); }
  const first = groups.keys().next().value;
  return [...groups].map(([label, g]) => `<details class="daygroup" ${(state.q || label === 'Today' || (!groups.has('Today') && label === first)) ? 'open' : ''}>
    <summary>${esc(label)}<span>${g.length} ${g.length === 1 ? 'story' : 'stories'}</span></summary><div class="stories">${g.map(storyCard).join('')}</div></details>`).join('');
}

/* ---------- Models + Sources ---------- */
const modelsView = () => `<h2 class="sec">New LLM models<span>${MODELS.length} released in the past 7 days</span></h2><div class="models-grid">${MODELS.map((m) => modelCard(m, true)).join('')}</div>`;
function sourcesView() {
  const meta = DATA.meta || {};
  const rows = (meta.sources || []).map((s) => `<div class="srcrow"><div><b>${esc(s.name)}</b><small>${esc(s.origin || '')}${s.type ? ' &middot; ' + esc(s.type) : ''}</small></div><span class="cnt">${esc(s.count ?? '')} items</span></div>`).join('');
  return `<div class="kv">
    <div><small>Last refreshed</small><b>${esc(longDate(new Date(DATA.lastUpdated || NOW)))}</b></div>
    <div><small>Schedule</small><b>${esc(meta.schedule || 'Twice daily')}</b></div>
    <div><small>Coverage</small><b>Past ${esc(meta.windowDays || 7)} days</b></div>
    <div><small>Analysis</small><b>${esc(meta.aiSummarizer || 'Gemini')}</b></div></div>
    <h2 class="sec">Data sources</h2><div class="srcgrid">${rows}</div>`;
}

/* ---------- routing ---------- */
function render(keepScroll) {
  renderTabs();
  const v = $('view');
  if (state.tab === 'overview') v.innerHTML = overview();
  else if (state.tab === 'models') v.innerHTML = modelsView();
  else if (state.tab === 'sources') v.innerHTML = sourcesView();
  else { v.innerHTML = newsShell(state.tab); $('results').innerHTML = newsResults(state.tab); }
  try { history.replaceState(null, '', '#' + state.tab); } catch (e) {}
  if (!keepScroll) window.scrollTo({ top: 0 });
}
function go(tab, topic) {
  if (tab === 'ai' || tab === 'db') state[tab] = topic || 'All';
  state.tab = tab; state.q = '';
  render();
}

// Only one "also making news" summary open at a time keeps the overview layout steady.
$('view').addEventListener('toggle', (e) => {
  const d = e.target;
  if (!d.classList || !d.classList.contains('also') || !d.open) return;
  $('view').querySelectorAll('details.also[open]').forEach((o) => { if (o !== d) o.open = false; });
}, true);

$('tabs').addEventListener('click', (e) => { const b = e.target.closest('.tab'); if (b) go(b.dataset.tab); });
$('view').addEventListener('click', (e) => {
  const g = e.target.closest('[data-go]');
  if (g) { go(g.dataset.go, g.dataset.topic); return; }
  const t = e.target.closest('[data-topic]');
  if (t && (state.tab === 'ai' || state.tab === 'db')) { state[state.tab] = t.dataset.topic; render(); }
});
$('view').addEventListener('input', (e) => {
  if (e.target.id !== 'q') return;
  state.q = e.target.value;
  $('results').innerHTML = newsResults(state.tab);
});

const hashVal = decodeURIComponent((location.hash || '').slice(1));
const cut = hashVal.indexOf('/');
const initial = cut < 0 ? hashVal : hashVal.slice(0, cut);
const initialTopic = cut < 0 ? '' : hashVal.slice(cut + 1);
if (TABS.some(([k]) => k === initial)) state.tab = initial;
if ((initial === 'ai' || initial === 'db') && initialTopic) state[initial] = initialTopic;
render(true);
})();
</script>
</body>
</html>
